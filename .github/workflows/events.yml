name: events
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy
        run: python fetch.py
        env:
          DAYS: "600"
      - name: Run events test
        run: python events.py data out
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/events_summary.txt out/events_results.csv
          git diff --cached --quiet || git commit -m "events $(date -u +%F)"
          git push
