name: signals
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy
        run: python fetch.py
        env:
          DAYS: "600"
      - name: Run signals
        run: python signals.py data out
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/signals_summary.txt out/signals_results.csv
          git diff --cached --quiet || git commit -m "signals $(date -u +%F)"
          git push
