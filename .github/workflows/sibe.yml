name: sibe
# Reel "SIBE" (Sweep -> Break of structure -> Entry) intraday test, 15-min data (data_orb). Result: out/sibe_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sibe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: data_orb
          key: data15-${{ github.run_id }}
          restore-keys: |
            data15-
            orb-data-
      - name: Restore from backup branch (agar cache nahi mila)
        run: |
          if [ -d data_orb ] && [ "$(ls data_orb | wc -l)" -ge 50 ]; then echo "cache ok: $(ls data_orb | wc -l) files"; exit 0; fi
          git fetch -q --depth 1 origin data-15min
          mkdir -p bk && git --work-tree=bk checkout FETCH_HEAD -- . && cat bk/data_orb.tar.gz.part* | tar xzf - && rm -rf bk
          git reset -q
          echo "backup se: $(ls data_orb | wc -l) files"
      - name: Run study
        run: python sibe_study.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/sibe_summary.txt out/sibe_results.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "sibe study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
