name: orb
# Intraday ORB study (15-min breakout + 8 EMA, reel wali strategy) on F&O stocks, ~1 saal ka data Angel se.
# Manual: Actions > orb > Run workflow. Result: out/orb_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache 15-min candles
        uses: actions/cache@v4
        with:
          path: data_orb
          key: orb-data-${{ github.run_id }}
          restore-keys: |
            data15-
            orb-data-
      - name: Run study
        run: python orb_study.py
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/orb_summary.txt out/orb_results.csv out/orb_trades.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "orb study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
