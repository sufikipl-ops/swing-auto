name: patternstudy
# Breakout pattern study (which eve-of-breakout conditions work) on about 4 years of data. Run manually: Actions > patternstudy > Run workflow.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patternstudy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Run study
        run: python pattern_study.py data out
      - name: Save result as download too (backup)
        uses: actions/upload-artifact@v4
        with:
          name: pattern-result
          path: |
            out/pattern_summary.txt
            out/pattern_buckets.csv
            out/pattern_combos.csv
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/pattern_summary.txt out/pattern_buckets.csv out/pattern_combos.csv
          git diff --cached --quiet && exit 0
          git commit -m "patternstudy $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
