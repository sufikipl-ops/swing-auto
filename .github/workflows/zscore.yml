name: zscore
# Reel "Z-score mean reversion" test (~4 saal daily). Manual. Result: out/zscore_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  zscore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Run study
        run: python zscore_study.py data out
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/zscore_summary.txt out/zscore_results.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "zscore study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
