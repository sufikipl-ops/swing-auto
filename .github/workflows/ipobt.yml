name: ipobt
# IPO score ka asli test: purane IPO (ipowatch subscription/GMP/company) vs NSE listing bhav. Manual. Result: out/ipo_backtest_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ipobt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Run backtest
        run: python ipo_backtest.py data
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          for f in out/ipo_hist.json out/ipo_backtest_summary.txt out/ipo_backtest.csv docs/ipo_backtest.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "ipo backtest $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
