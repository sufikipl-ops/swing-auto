name: unwind
# Long unwinding robustness test (bhav gira + OI ghata -> kharido). Manual. Result: out/unwind_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  unwind:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache F&O OI
        uses: actions/cache@v4
        with:
          path: out/fo_oi.json
          key: fo-oi-${{ github.run_id }}
          restore-keys: |
            fo-oi-
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Run study
        run: python unwind_study.py data out
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/unwind_summary.txt || true
          git diff --cached --quiet && exit 0
          git commit -m "unwind study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
