name: app
on:
  workflow_dispatch: {}
  schedule:
    - cron: "50 12 * * 1-5"
permissions:
  contents: write
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy
        run: python fetch.py
        env:
          DAYS: "380"
      - name: Build stock data
        run: python stock_report.py data docs
      - name: Copy latest reports for the app
        run: |
          for f in screen_latest.csv gap_check.csv news_events.csv news_events.txt picks_review.csv; do
            [ -f out/$f ] && cp out/$f docs/$f || true
          done
      - name: Commit
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "app data $(date -u +%F)"
          git pull --rebase
          git push
