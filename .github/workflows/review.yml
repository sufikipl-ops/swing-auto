name: review
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 15 * * 1-5"
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download recent bhavcopy
        run: python fetch.py
        env:
          DAYS: "40"
      - name: Run picks review
        run: python picks_review.py data out
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/picks_review.txt
          git add out/picks_review.csv || true
          if [ -f out/picks_review.csv ]; then cp out/picks_review.csv docs/picks_review.csv; git add docs/picks_review.csv; fi
          git diff --cached --quiet && exit 0
          git commit -m "picks review $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
