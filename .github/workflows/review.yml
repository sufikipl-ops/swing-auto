name: review
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 15 * * 1-5"
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download recent bhavcopy
        run: python fetch.py
        env:
          DAYS: "40"
      - name: Run picks review
        run: python picks_review.py data out
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/picks_review.txt
          git add out/picks_review.csv || true
          git diff --cached --quiet || git commit -m "picks review $(date -u +%F)"
          git pull --rebase || true
          git push
