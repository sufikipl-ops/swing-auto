name: daily-screen
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 18:00 IST
    - cron: "0 14 * * 1-5"    # 19:30 IST (retry if NSE file was late)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy
        run: python fetch.py
      - name: Run screen
        run: python screen.py data out
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/
          git diff --cached --quiet || git commit -m "screen $(date -u +%F)"
          git push
