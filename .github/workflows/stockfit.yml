name: stockfit
# Har stock ki apni strategy ka imaandar test (setup 2022-24 se chuno, 2025-26 pe check). Manual: Actions > stockfit > Run workflow.
# Result: out/stock_summary.txt, out/stock_results.csv
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stockfit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Regime study with per-stock trades
        run: TRADES=1 python regime_study.py data sf
      - name: Stock study
        run: |
          python stock_study.py sf
          PICK=turnover python stock_study.py sf
          TRAIN_FROM=2025-01-01 SPLIT=2026-01-01 MIN_TRAIN=4 SUFX=_2025to2026 python stock_study.py sf
          TRAIN_FROM=2025-01-01 SPLIT=2026-01-01 MIN_TRAIN=4 SUFX=_2025to2026 PICK=turnover python stock_study.py sf
          mkdir -p out && cp sf/stock_summary*.txt sf/stock_results*.csv out/
      - name: Commit result
        run: |
          git checkout -- docs/regime.json || true
          git checkout -- docs/regime_trades.json 2>/dev/null || rm -f docs/regime_trades.json
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/stock_summary*.txt out/stock_results*.csv
          git diff --cached --quiet && exit 0
          git commit -m "stock study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
