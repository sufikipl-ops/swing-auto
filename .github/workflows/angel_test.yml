name: angel_test
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  angel_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Angel One test
        run: python angel_test.py
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/angel_test.txt
          git diff --cached --quiet || git commit -m "angel test $(date -u +%F)"
          git push
