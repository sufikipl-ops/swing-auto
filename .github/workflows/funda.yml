name: funda
# Fundamentals safety check (promoter pledge, promoter holding, Debt/Equity) for screen + dip + locked stocks.
# Writes docs/funda.json. Har stock 7 din cache rehta hai. Run manually: Actions > funda > Run workflow.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "55 13 * * 1-5"   # 19:25 IST (screen + dip + restrict ke baad)
permissions:
  contents: write
jobs:
  funda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fundamentals check
        run: python funda.py
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add docs/funda.json
          git diff --cached --quiet && exit 0
          git commit -m "funda $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
