name: names
# Company name list (search by name). Run once: Actions > names > Run workflow. Auto-refresh monthly.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 2 1 * *"
permissions:
  contents: write
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python names.py
      - name: Commit
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add docs/names.json
          git diff --cached --quiet && exit 0
          git commit -m "names $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
