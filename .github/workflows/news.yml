name: news
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 1 * * 1-5"
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run news check
        run: python news_events.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/news_events.txt out/news_events.csv
          git diff --cached --quiet || git commit -m "news $(date -u +%F)"
          git pull --rebase
          git push
