name: news
# Announcements / events check + PDF saar. Subah 7:00 IST + market ke time 3 baar (9:30, 11:30, 1:30).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 1 * * 1-5"
    - cron: "0 4,6,8 * * 1-5"
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install pypdf
      - name: Run news check
        run: python news_events.py
        env:
          # Optional: asli AI saar ke liye. Secret na ho to free auto-saar chalta hai.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/news_events.txt out/news_events.csv out/announcements.json docs/announcements.json || true
          git diff --cached --quiet || git commit -m "news $(date -u +%F-%H%M)"
          git pull --rebase || true
          git push
