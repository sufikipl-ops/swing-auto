name: news
# Announcements / events check + PDF saar. Subah 7:00 IST + market ke time (9 baje se 3:30 tak) har 20 minute.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 1 * * 1-5"
    - cron: "*/20 3-10 * * 1-5"   # 8:30 - 16:30 IST har 20 min (GitHub kabhi kabhi 5-10 min late chalata hai)
permissions:
  contents: write
concurrency:
  group: news-check
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install pypdf pypdfium2
      - name: Run news check
        run: python news_events.py
        env:
          # Optional: asli AI saar ke liye. Secret na ho to free auto-saar chalta hai.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Saare stocks ki khabar (badi sites + NSE, naam se stock pehchan)
        if: always()
        run: python news_all.py
      - name: IPO (open/aane wale, subscription, GMP, financials)
        if: always()
        run: python ipo.py
      - name: Copy news flags for the app
        if: always()
        run: |
          for f in news_events.csv news_events.txt; do [ -f out/$f ] && cp out/$f docs/$f || true; done
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/news_events.txt out/news_events.csv out/announcements.json docs/announcements.json docs/news_events.csv docs/news_events.txt || true
          for f in docs/stock_news.json out/bse_codes.json out/news_all_hist.json docs/ipo.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "news $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
