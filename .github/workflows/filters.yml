name: filters
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  filters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download 1 year bhavcopy
        run: python fetch.py
        env:
          DAYS: "380"
      - name: Run filters
        run: python filters.py data out
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/filters_summary.txt out/filters_results.csv
          git diff --cached --quiet || git commit -m "filters $(date -u +%F)"
          git push
