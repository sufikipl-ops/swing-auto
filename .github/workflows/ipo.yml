name: ipo
# Naye listing (pehle 60 din) study: listing-ke-baad low ke paas bounce chalta hai ya nahi. ~4 saal. Result: out/ipo_summary.txt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ipo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download bhavcopy (about 4 years)
        run: python fetch.py
        env:
          DAYS: "1500"
      - name: Run study
        run: python ipo_study.py data out
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add out/ipo_summary.txt out/ipo_results.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "ipo study $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
