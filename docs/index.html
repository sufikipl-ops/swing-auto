<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Swing Desk"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Swing Desk</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--tx:#e8eef5;--mu:#8a9bb0;--g:#2fbf71;--r:#e5534b;--y:#e3b341;--b:#4c9aff;--bd:#263445}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:70px}
header{padding:12px 14px;border-bottom:1px solid var(--bd)}h1{font-size:18px;margin:0 0 4px}
.mk{font-size:12px;color:var(--mu)}.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;margin:2px 3px 2px 0;background:#223245}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}.mu{color:var(--mu)}
.pg{background:#12301f;color:var(--g)}.pr{background:#3a1a19;color:var(--r)}.py{background:#3a3016;color:var(--y)}.pb{background:#16283d;color:var(--b)}
main{padding:10px 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.big{font-size:17px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1118;border-top:1px solid var(--bd);z-index:40}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mu);font-size:14px}nav button.on{color:var(--b);font-weight:600}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0b1118;color:var(--tx);font-size:16px}
.btn{display:inline-block;padding:8px 12px;border-radius:8px;background:#223245;color:var(--tx);text-decoration:none;font-size:13px;margin:4px 6px 0 0}
.sug div{padding:10px;border-bottom:1px solid var(--bd)}small{color:var(--mu)}h3{margin:14px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
li{margin:3px 0}ul{padding-left:18px;margin:4px 0}.foot{font-size:11px;color:var(--mu);padding:8px 14px}
/* sticky back bar (stock detail) */
#bar{display:none;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--bd);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;align-items:center;gap:12px}
body.det #bar{display:flex}body.det header{display:none}
.back{background:#223245;color:var(--tx);border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;min-height:44px;flex:none}
/* ranked pick cards */
.hint{font-size:13px;color:var(--mu);margin:2px 2px 10px}
.hd{display:flex;gap:10px;align-items:center}
.rk{width:34px;height:34px;border-radius:50%;background:#223245;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.rk.r1{background:#e3b341;color:#1a1400}.rk.r2{background:#c0c8d2;color:#10161d}.rk.r3{background:#c98a54;color:#1f1206}
.card.t3{border-color:#e3b34188}
.why{font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.tiles div{background:#0f1923;border:1px solid var(--bd);border-radius:8px;padding:6px 2px;text-align:center}
.tiles small{display:block;font-size:11px}.tiles b{font-size:14px}
/* lock / pin */
.pinb{background:#223245;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;flex:none}
.pinb.on{background:#3a3016;color:var(--y);border-color:#e3b34188}
#bar .pinb{margin-left:auto;min-height:44px;padding:8px 14px}
.card.pinned{border-color:#4c9aff88}
.sec{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 6px}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:78px;z-index:60;background:#223245;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:14px;text-align:center}
.sec h3{margin:0}
.tg{background:#223245;color:var(--tx);border:0;border-radius:8px;padding:6px 10px;font-size:13px}
/* announcements */
.ann{margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:#0f1923;padding:2px 10px}
.ann summary{font-size:13px;padding:8px 0;color:var(--tx);list-style:none}.ann summary::-webkit-details-marker{display:none}
.ann summary::after{content:' \25BE';color:var(--b)}.ann[open] summary::after{content:' \25B4'}
.ai{padding:8px 0;border-top:1px solid var(--bd)}.ai:first-of-type{border-top:0}.at{font-size:14px;margin:4px 0}.sm{margin:6px 0;padding:8px;border-left:3px solid var(--b);background:#12202e;border-radius:6px;font-size:14px}
/* live */
.lv{margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:#0f1923}
.lvg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.lvg div{text-align:center}.lvg small{display:block;font-size:11px}.lvg b{font-size:13px}
/* detail report */
.vd{border-left:4px solid var(--bd)}.vd.g{border-left-color:var(--g)}.vd.y{border-left-color:var(--y)}.vd.r{border-left-color:var(--r)}
.vd .vt{font-size:18px;font-weight:700;margin:6px 0 2px}
.ck{margin:5px 0;font-size:14px}
.ir{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.ir:last-child{border-bottom:0}
.ir .l{flex:1}.ir .l small{display:block}.ir .v{text-align:right;font-weight:600;white-space:nowrap}.ir .v small{display:block;font-weight:400}
.lr{display:flex;justify-content:space-between;padding:6px 8px;border-radius:6px;font-size:14px}
.lr.up{color:#f0a19c}.lr.dn{color:#8fdcae}.lr.now{background:#223245;color:var(--tx);font-weight:700;margin:3px 0}
.lr.en{color:var(--b);font-weight:600}.lr.tg{color:var(--g);font-weight:600}.lr.sl{color:var(--r);font-weight:600}
details{margin-top:8px}summary{cursor:pointer;color:var(--b);font-size:14px;padding:6px 0}
.ign{background:#3a1a19;border:1px solid var(--r);color:#ffb4ae;border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px}
</style></head><body>
<header><div class="row"><h1>Swing Desk</h1><span><button id="ntf" class="tg" style="display:none" onclick="askNotif()">Alerts on</button> <button id="inst" class="tg" style="display:none" onclick="installApp()">Install</button></span></div><div class="mk" id="mk">loading...</div></header>
<div id="bar"></div>
<main id="v"></main>
<div class="foot">Sirf technical jankari, advice nahi. Profit ki guarantee nahi. Trade se pehle khud verify karo.</div>
<div id="toast"></div>
<nav><button data-t="picks" class="on">Picks</button><button data-t="search">Search</button><button data-t="trades">Trades</button><button data-t="news">News</button><button data-t="global">Global</button></nav>
<script>
/* ===== SYNC: Google Sheet (Apps Script web app) se Lock + risk/capital sab devices par same rehte hain. Sirf PIN_URL badalna hai ===== */
var PIN_URL='https://script.google.com/macros/s/AKfycbwTutE4YKjhrqUNwYuZwgRqPSLvelaSeBwkibi2M6Kmexkfh27jVgYcceTr8yh73mQ7yQ/exec',PIN_KEY='sd-24e5af0f609d8c48f5c5';
var RS=null,GL=null,MC=[],DP=[],DPM={},NM={},NMN={},NMA=[],TGC={},TG=[],TGTS=0,TGQ='',AN={},ANTS='',D={},SC=[],SR=[],GP={},NW={},TR=[],HL=[],ST={},SK={},MK={},PK={},RK={},tab='picks',cur=null,lastY=0,PN=[],SHOWALL=false,TOPN=8;
var FLG={RESULTS_SOON:'Result/board meeting paas hai',NEW_ANNOUNCEMENT:'Nayi announcement aayi hai',IN_NEWS:'Khabron me hai'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function csv(t){var o=[],r=[],f='',q=false,i,c;for(i=0;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0])o.push(r);r=[]}else f+=c}
if(f||r.length){r.push(f);o.push(r)}if(!o.length)return[];var h=o[0];return o.slice(1).map(function(x){var d={};h.forEach(function(k,j){d[k]=x[j]});return d})}
function get(u,j){return fetch(u+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return j?r.json():r.text()}).catch(function(){return null})}
function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:+v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsj(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function svj(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function f(x,n){return x==null||x===''||isNaN(x)?'-':(+x).toFixed(n==null?2:n)}
function rs0(x){return 'Rs '+Math.round(x).toLocaleString('en-IN')}
function chip(t,c){return '<span class="pill '+(c||'')+'">'+esc(t)+'</span>'}
function vc(v){return v=='STRONG'?'pg':v=='WEAK'?'pr':'py'}
function flagChips(fl){if(!fl||fl=='none')return '';return fl.split(' ').map(function(k){return chip(FLG[k]||k,k=='RESULTS_SOON'?'pr':'py')}).join('')}
function gapChip(g){return g?chip('9:20 gap: '+g.status,g.status=='TRIGGERED'?'pg':g.status=='WAIT'?'py':'pr'):''}

/* ---------- ANNOUNCEMENTS: NSE ka apna text + importance tag + PDF link (news_events.py banata hai) ---------- */
var ANL={HIGH:['Bada asar','pr',0],MID:['Padh lo','py',1],LOW:['Routine','',2]};
function annSorted(sym){var L=(AN[sym]||[]).slice();return L.sort(function(a,b){return (ANL[a.level]||ANL.MID)[2]-(ANL[b.level]||ANL.MID)[2]})}
function annItem(a){var l=ANL[a.level]||ANL.MID,ok=/^https:\/\/(nsearchives|www)\.nseindia\.com\//.test(a.link||'');
var asr=a.asar=='positive'?['Asar: positive','pg']:a.asar=='negative'?['Asar: negative','pr']:a.asar=='neutral'?['Asar: neutral','']:null,
sm=a.summary?'<div class="sm"><b>'+(a.sum_src=='ai'?'AI saar':'Auto saar (PDF se)')+'</b> '+(asr?chip(asr[0],asr[1]):'')+'<div>'+esc(a.summary)+'</div><small>'+(a.sum_src=='ai'?'AI ne PDF padh ke likha, galti ho sakti hai.':'Software ne PDF se vaakya nikaale, galti ho sakti hai.')+' Pakka karne ke liye PDF dekho.</small></div>':'';
return '<div class="ai"><div>'+chip(l[0],l[1])+'<b>'+esc(a.cat)+'</b> <small>'+esc(a.date)+'</small></div>'+sm+(a.text?'<div class="at">'+(a.summary?'<small>NSE text:</small> ':'')+esc(a.text)+'</div>':'')+
'<small>'+esc(a.hint)+'</small>'+(ok?'<div><a class="btn" target="_blank" rel="noopener" href="'+esc(a.link)+'">Poora padho (PDF)</a></div>':'')+'</div>'}
function annBlock(sym,full){var L=annSorted(sym);if(!L.length)return '';var top=L[0],l=ANL[top.level]||ANL.MID;
if(full)return '<h3>Announcements (pichhle 3 din)</h3>'+L.map(annItem).join('')+'<small>Text NSE ka apna hai (AI summary nahi). Poori baat PDF me. '+(ANTS?'Update: '+esc(ANTS.replace('T',' '))+' IST':'')+'</small>';
return '<details class="ann" onclick="event.stopPropagation()"><summary>Announcement'+(L.length>1?'s ('+L.length+')':'')+': '+chip(l[0],l[1])+esc(top.cat)+'</summary>'+L.map(annItem).join('')+'</details>'}

/* ---------- LIVE: Angel One se aaya aaj ka LTP / open / high / low / kal ka close (live.py -> Google Sheet -> yahan) ---------- */
var LV=null,LVSIG='';
function istNow(){return new Date(Date.now()+19800000)}
function istDate(){return istNow().toISOString().slice(0,10)}
function marketHours(){var n=istNow(),d=n.getUTCDay(),m=n.getUTCHours()*60+n.getUTCMinutes();return d>=1&&d<=5&&m>=530&&m<=945}
function liveAge(){if(!LV||!LV.ts)return 1e9;return (istNow().getTime()-Date.parse(LV.ts+'Z'))/1000}
function lvTime(){return LV&&LV.ts?LV.ts.slice(11,19):''}
function tradedTodayStr(t){t=String(t||'');var m=t.match(/(\d{2})-([A-Za-z]{3})-(\d{4})/);if(m){var mo={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'}[m[2]];return m[3]+'-'+mo+'-'+m[1]==istDate()}
m=t.match(/(\d{4}-\d{2}-\d{2})/);return !!m&&m[1]==istDate()}
function liveItem(sym){var it=LV&&LV.items&&LV.items[sym];return it&&it.ltp>0&&tradedTodayStr(it.t)?it:null}
/* poore feed ki halat: ok / off / err / stale / closed */
function liveState(){if(!pinsOn())return['off','Live: sync setup baaki'];if(!LV)return['wait','Live: data aa raha hai...'];
if(LV.status=='err')return['err','Live feed me dikkat: '+(LV.err||'')];
var age=liveAge();
if(marketHours()&&age>150)return['stale','Live feed ruka hua hai ('+Math.round(age/60)+' min purana). GitHub Actions "live" check karo'];
if(LV.status=='closed'||(LV.date&&LV.date!=istDate()))return['closed',marketHours()?'Aaj market me trade nahi dikha (holiday ya abhi shuru nahi)':'Market band'];
return['ok',marketHours()?'Live '+lvTime():'Market band, aakhri live '+lvTime()]}
/* plan ke hisaab se aaj ka status (angel_gap.py wale hi rules): skip / triggered / wait */
function liveStatus(it,pc,p){if(!p)return null;var o=it.o||it.ltp,gap=(o/pc-1)*100,trig=p.entry,SK=1.015;
if(o>trig*SK)return['skip','Entry se 1.5% upar khula: skip, peecha mat karo','pr'];
if(gap<=-1.5)return['skip','Gap-down ('+f(gap,1)+'%): skip','pr'];
if(it.ltp<=p.stop)return['skip','Stop-loss ke neeche: skip','pr'];
if(it.ltp>=p.t1)return['target','Target tak pahunch gaya','pg'];
if(it.h>=trig)return it.ltp<=trig*SK?['trig','Triggered: abhi entry zone me','pg']:['skip','Bahut upar nikal gaya: peecha mat karo','pr'];
return['wait','Wait: entry se '+f((trig/it.ltp-1)*100,1)+'% neeche','py']}
function livePlan(sym){var pk=PK[sym];return pk?pickPlan(pk):null}
function livePc(sym,it){var pk=PK[sym],s=ST[sym];return it.pc>0?it.pc:pk?+pk.CLOSE:s?s.c:it.ltp}
function liveSkip(sym){var it=liveItem(sym);if(!it||!PK[sym])return false;var st=liveStatus(it,livePc(sym,it),livePlan(sym));return !!st&&st[0]=='skip'}
/* price label: market chalu = "Abhi" (live), band = "Aaj close", aaj ka trade nahi = "Kal close" */
function marketOpenNow(){var n=istNow(),d=n.getUTCDay(),m=n.getUTCHours()*60+n.getUTCMinutes();return d>=1&&d<=5&&m>=555&&m<=930}
function priceHtml(sym,c,g){var it=liveItem(sym),lab,p,ch;
if(it){p=it.ltp;ch=(p/livePc(sym,it)-1)*100;lab=marketOpenNow()?'Abhi':'Aaj close'}else{p=+c;ch=+g;lab='Kal close'}
return lab+' <b>'+f(p)+'</b> <span class="'+(ch>=0?'g':'r')+'">'+(ch>=0?'+':'')+f(ch,2)+'%</span>'}
function lvp(sym,c,g){return '<span data-lvp="'+esc(sym)+'" data-c="'+esc(c)+'" data-g="'+esc(g)+'">'+priceHtml(sym,c,g)+'</span>'}
function liveStrip(sym,full){var it=liveItem(sym);
if(!it){var ls0=liveState();return ls0[0]=='ok'||ls0[0]=='closed'||ls0[0]=='off'?'':'<small class="y">'+esc(ls0[1])+'</small>'}
var pc=livePc(sym,it),chg=(it.ltp/pc-1)*100,gap=((it.o||it.ltp)/pc-1)*100,st=liveStatus(it,pc,livePlan(sym)),c=chg>=0?'g':'r',gc=gap>=0?'g':'r',h='';
h+='<div class="lv"><div class="row"><div><b class="big">'+f(it.ltp)+'</b> <span class="'+c+'">'+(chg>=0?'+':'')+f(chg,2)+'%</span></div><small>'+(marketHours()?'Live '+lvTime():'Aakhri '+lvTime())+'</small></div>'+
'<div class="lvg"><div><small>Kal close</small><b>'+f(pc)+'</b></div><div><small>Aaj open</small><b>'+f(it.o)+' <span class="'+gc+'">('+(gap>=0?'+':'')+f(gap,1)+'%)</span></b></div><div><small>High</small><b>'+f(it.h)+'</b></div><div><small>Low</small><b>'+f(it.l)+'</b></div></div>';
if(st)h+='<div>'+chip(st[1],st[2])+(it.vwap>0&&it.ltp<it.vwap?chip('VWAP ke neeche','py'):'')+'</div>';
else if(full&&it.vwap>0)h+='<div>'+chip(it.ltp<it.vwap?'VWAP ke neeche':'VWAP ke upar',it.ltp<it.vwap?'py':'pg')+'</div>';
return h+'</div>'}
function paintLive(){var pe=document.querySelectorAll('[data-lvp]');for(var j=0;j<pe.length;j++){pe[j].innerHTML=priceHtml(pe[j].getAttribute('data-lvp'),pe[j].getAttribute('data-c'),pe[j].getAttribute('data-g'))}
var els=document.querySelectorAll('[data-lv]');for(var i=0;i<els.length;i++){els[i].innerHTML=liveStrip(els[i].getAttribute('data-lv'),els[i].getAttribute('data-full')=='1')}
var c=document.getElementById('lvchip');if(c){var s=liveState();c.innerHTML=chip(s[1],s[0]=='ok'?'pg':s[0]=='closed'||s[0]=='off'||s[0]=='wait'?'':'pr')}}
function skipSig(){var a=[];SR.forEach(function(r){if(liveSkip(r.SYMBOL))a.push(r.SYMBOL)});DP.forEach(function(r){var l=dipLive(r);a.push('d'+r.SYMBOL+(l?l[0]:''))});return a.join(',')+'|'+ignSig()}
function onLive(){paintLive();if(!cur&&tab=='picks'){var ae=document.activeElement;if(ae&&ae.tagName=='INPUT')return;rankAll();var sg=skipSig();if(sg!==LVSIG){lastY=window.pageYOffset||0;render(true)}}}
function tick(){if(!document.hidden){syncAll();maybeRefresh()}setTimeout(tick,marketHours()?30000:300000)}

/* ---------- SYNC + LOCK: Lock, Risk, Capital, "Sab dikhao" Google Sheet me save hote hain => phone/laptop/web par same ---------- */
function pinsOn(){return PIN_URL.indexOf('https://')==0||PIN_URL.indexOf('http://127.0.0.1')==0}
function isPin(sym){return PN.indexOf(sym)>=0}
function pinBtn(sym,id){var on=isPin(sym);return '<button '+(id?'id="'+id+'" ':'')+'class="pinb'+(on?' on':'')+'" onclick="togglePin(\''+esc(sym)+'\',event)">'+(on?'Locked &#10003;':'Lock')+'</button>'}
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},3500)}
function api(p){var u=PIN_URL+'?key='+encodeURIComponent(PIN_KEY)+'&t='+Date.now();for(var k in p)u+='&'+k+'='+encodeURIComponent(p[k]);
return fetch(u).then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)throw 0;return d})}
/* server ka jawab local me lagao. true = kuch badla */
function applyServer(d){var ch=false;if(d.live)LV=d.live;
if(Array.isArray(d.pins)){if(JSON.stringify(d.pins)!=JSON.stringify(PN))ch=true;PN=d.pins;svj('pins',PN)}
var s=d.settings||{};['risk','cap'].forEach(function(k){var v=+s[k];if(v>0&&v!=ls(k,k=='risk'?700:50000)){sv(k,v);ch=true}});
if(s.showall!=null&&s.showall!==''){var sa=+s.showall==1;if(sa!==SHOWALL){SHOWALL=sa;sv('showall',sa?1:0);ch=true}}
return ch}
function syncAll(){if(!pinsOn())return;api({action:'get'}).then(function(d){if(applyServer(d)&&!cur&&tab=='picks'){lastY=window.pageYOffset||0;render(true)}onLive()}).catch(function(){})}
function setSetting(k,v){sv(k,v);if(!pinsOn())return;api({action:'set',k:k,v:v}).catch(function(){toast('Setting sync nahi hui (internet?). Is device par lag gayi hai.')})}
function refreshPinUI(sym){if(cur){var b=document.getElementById('pinb');if(b){var on=isPin(sym);b.className='pinb'+(on?' on':'');b.innerHTML=on?'Locked &#10003;':'Lock'}}else{lastY=window.pageYOffset||0;render(true)}}
function togglePin(sym,ev){if(ev&&ev.stopPropagation)ev.stopPropagation();var had=isPin(sym),prev=PN.slice();
if(had)PN.splice(PN.indexOf(sym),1);else PN.push(sym);svj('pins',PN);refreshPinUI(sym);
if(!pinsOn()){toast('Sync setup baaki hai: lock abhi sirf is device par save hua');return}
api({action:had?'remove':'add',sym:sym}).then(function(d){if(applyServer(d))refreshPinUI(sym)}).catch(function(){PN=prev;svj('pins',PN);refreshPinUI(sym);toast('Sync nahi hua, internet dekho aur dobara try karo')})}
/* data kitna purana hai: last trading day (weekend/holiday ka dhyan) */
