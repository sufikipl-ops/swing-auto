/* ---- clean/simple look: normal-size text, compact cards, centered column on desktop ---- */
body{font-size:13px;line-height:1.4;-webkit-text-size-adjust:100%;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
header,main,.foot{max-width:720px;margin-left:auto;margin-right:auto}

.card{border-radius:12px;padding:10px 12px;margin:0 0 9px;box-shadow:var(--sh)}
.big{font-size:15px;font-weight:700}
.pill{padding:2px 7px;font-size:10.5px;border-radius:999px}

/* ---------- LIVE: Angel One se aaya aaj ka LTP / open / high / low / kal ka close (live.py -> Google Sheet -> yahan) ---------- */

function planFrom(entry,stop,atr,res){var risk=ls('risk',700),capi=ls('cap',50000),rs=entry-stop;if(!(rs>0)||!(entry>0))return null;
if(atr>0&&rs>2*atr){stop=entry-2*atr;rs=2*atr}
var q=Math.floor(risk/rs),mx=Math.floor(capi/entry);if(q>mx)q=mx;if(q<0)q=0;
var t1=entry+2*rs;if(atr>0)t1=entry+Math.min(2*rs,1.5*atr);
if(res>entry+0.5*(atr||0)&&res*0.995<t1)t1=res*0.995;
return{entry:entry,stop:stop,t1:t1,q:q,val:q*entry,loss:q*rs,gain:q*(t1-entry),rs:rs,rp:rs/entry*100,rr:(t1-entry)/rs,ta:atr>0?(t1-entry)/atr:0}}
